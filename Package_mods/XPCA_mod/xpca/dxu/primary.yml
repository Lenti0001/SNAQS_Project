- name: PRODCATG
  value: SCIENCE.CATALOG
  description: Data product category
  origin: static

- name: ORIGIN
  value: ESO-PARANAL
  description: Observatory or facility
  origin: static

- name: TELESCOP
  value: ESO-VISTA
  description: ESO telescope designation
  origin: static

- name: INSTRUME
  value: QMOST
  description: Instrument name
  origin: static

- name: OBJECT
  value: MULTI
  description: Target designation as given by PI
  origin: static

- name: PROG_ID
  datatype: str
  regexp: '([0-9]{2,3}\.[A-Z]-[0-9]{4}\([A-Z]\))|([0-9]{3}\.[A-Z0-9]{4}\.[0-9]{3})|MULTI'
  description:
    The identification code assigned to each observing run by the
    Observing Programme Committee (OPC) in the format
    *PPP.AAAA.nnn* where *PPP* is the ESO period during which
    the Cycle of the Proposal starts, *AAAA* is a string of 4
    characters, numeric and uppercase alphabetic picked from a list,
    and *nnn* is a 0-padded 3 digit integer identifying the Run.
    If any SDP originates from more than one observing run or
    observing programme, the value shall be ``MULTI``, and
    the individual programme IDs shall be stored in keywords
    PROGIDi.
  notes: updated from MEC primary header

- name: OBID
  datatype: int
  array: true
  description: Observation Block IDs of the observations used
  origin: updated from MEC OBMETATAB

- name: MJD-OBS
  datatype: float
  unit: d
  description: Start of (earliest) observation
  origin: updated from MEC OBMETATAB

- name: MJD-END
  datatype: float
  unit: d
  description: End of (latest) observation
  origin: updated from MEC OBMETATAB

- name: OBSTECH
  value: MOS
  description: Technique used during observation
  origin: static

- name: PHOTSYS
  value: AB
  description: Photometric system for any magnitudes reported
  notes: static

- name: REFERENC
  datatype: str
  description: Primary publication describing data product
  origin: static

- name: PROVXTN
  value: true
  description: Provenance of files originating data product
  origin: static

- name: QMNODE
  value: QXP
  description: 4MOST pipeline that produced this data product
  origin: static

- name: PROCSOFT
  datatype: str
  description: Software version number
  regexp: '[\w\.-]+\+[\w-]{2,8}'
  origin: updated by QXP manager

- name: DXUDOC
  value: MST-TNO-PSC-20308-9238-0001
  description: Data eXchange Unit document
  origin: static

- name: PCONTACT
  value: iwg-exgalpipe@4most.eu
  description: Email regarding this product
  origin: static

- name: DATE
  datatype: str
  regexp: '[0-9]{4}-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]'
  description: Date and time (UTC) when file was created in 4DPC
